version: '3.7'

services:
  wire-a-demo:
    build:
      context: .
    networks:
      - cssninja-services
    restart: '${MOEBIUS_DEMO_RESTART:-no}'
    labels:
      traefik.enable: true
      traefik.docker.network: 'cssninja-services'
      traefik.http.routers.wire-a-demo.entrypoints: 'http'
      traefik.http.routers.wire-a-demo.rule: 'Host(`wire-a.${HOST:-127.0.0.1.nip.io}`)'
      traefik.http.routers.wire-a-demo.middlewares: 'https-redirect@file'
      traefik.http.services.wire-a-demo-https.loadbalancer.server.port: 8080
      traefik.http.routers.wire-a-demo-https.rule: 'Host(`wire-a.${HOST:-127.0.0.1.nip.io}`)'
      traefik.http.routers.wire-a-demo-https.tls: true
      traefik.http.routers.wire-a-demo-https.entrypoints: 'https'
      traefik.http.routers.wire-a-demo-https.tls.certresolver: 'http'

networks:
  cssninja-services:
    external: true
