---
layout: default
title: Master Layout
---

{{> generic-sidebar}}
{{> elements-mobile-subsidebar}}

<!-- Content Wrapper -->
<div id="app-home" class="view-wrapper" data-naver-offset="150" data-menu-item="#home-sidebar-menu"
    data-mobile-item="#home-sidebar-menu-mobile">

    <div class="page-content-wrapper">
        <div class="page-content is-relative">

            <div class="page-title has-text-centered">
                <!-- Sidebar Trigger -->
                <div class="huro-hamburger nav-trigger push-resize" data-sidebar="home-sidebar">
                    <span class="menu-toggle has-chevron">
                        <span class="icon-box-toggle">
                            <span class="rotate">
                                <i class="icon-line-top"></i>
                                <i class="icon-line-center"></i>
                                <i class="icon-line-bottom"></i>
                            </span>
                        </span>
                    </span>
                </div>

                <div class="title-wrap">
                    <h1 class="title is-4">Apex Charts </h1>
                    <p>Apex charts examples</p>
                </div>

                {{> toolbar}}
            </div>

            <div class="page-content-inner apex-dashboard">
                <div class="columns">
                    <div class="column is-12">
                        <div class="s-card">
                            <div id="dashboard-chart"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
