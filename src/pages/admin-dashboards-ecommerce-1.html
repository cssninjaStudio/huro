---
layout: default
title: Ecommerce Dashboard
---

{{> generic-sidebar}}
{{> generic-mobile-subsidebar}}

<!-- Content Wrapper -->
<div class="view-wrapper" data-naver-offset="150" data-menu-item="#home-sidebar-menu"
    data-mobile-item="#home-sidebar-menu-mobile">

    <div class="page-content-wrapper">
        <div class="page-content is-relative">

            <div class="page-title has-text-centered">
                <!-- Sidebar Trigger -->
                <div class="huro-hamburger nav-trigger push-resize" data-sidebar="home-sidebar">
                    <span class="menu-toggle has-chevron">
                        <span class="icon-box-toggle">
                            <span class="rotate">
                                <i class="icon-line-top"></i>
                                <i class="icon-line-center"></i>
                                <i class="icon-line-bottom"></i>
                            </span>
                        </span>
                    </span>
                </div>

                <div class="title-wrap">
                    <h1 class="title is-4">Dashboard</h1>
                </div>

                {{> toolbar}}
            </div>

            <div class="page-content-inner">

                <!--Ecommerce Dashboard V1-->
                <div class="personal-dashboard ecommerce-dashboard-v1">

                </div>

            </div>

        </div>
    </div>

</div>
