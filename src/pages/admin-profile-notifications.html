---
layout: default
title: Notifications
---

{{> layouts-sidebar}}
{{> layouts-mobile-subsidebar}}

<!-- Content Wrapper -->
<div id="notifications-page" class="view-wrapper" data-naver-offset="214" data-menu-item="#layouts-sidebar-menu"
    data-mobile-item="#home-sidebar-menu-mobile">

    <div class="page-content-wrapper">
        <div class="page-content is-relative">

            <div class="page-title has-text-centered">
                <!-- Sidebar Trigger -->
                <div class="huro-hamburger nav-trigger push-resize" data-sidebar="layouts-sidebar">
                    <span class="menu-toggle has-chevron">
                        <span class="icon-box-toggle">
                            <span class="rotate">
                                <i class="icon-line-top"></i>
                                <i class="icon-line-center"></i>
                                <i class="icon-line-bottom"></i>
                            </span>
                        </span>
                    </span>
                </div>

                <div class="title-wrap">
                    <h1 class="title is-4">Notifications</h1>
                </div>

                {{> toolbar}}
            </div>

            <div class="page-content-inner">

                <!--Notifications Page-->
                <div class="timeline-wrapper">
                    <div class="timeline-header"></div>
                    <div class="timeline-wrapper-inner">
                        <div class="timeline-container">

                            <!--Timeline item-->
                            <div class="timeline-item">
                                <div class="date">
                                    <span>Sep 23, 2020</span>
                                </div>
                                <div class="dot"></div>
                                <div class="content-wrap">
                                    <div class="content-box">
                                        <div class="status"></div>
                                        <div class="h-avatar">
                                            <img class="avatar" src="https://via.placeholder.com/150x150"
                                                data-demo-src="assets/img/avatars/photos/13.jpg" alt=""
                                                data-user-popover="6">
                                            <img class="badge" src="https://via.placeholder.com/150x150"
                                                data-demo-src="assets/img/icons/stacks/illustrator.svg">
                                        </div>
                                        <div class="box-text">
                                            <div class="meta-text">
                                                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                                                <span>11:42 am</span>
                                            </div>
                                            <div class="meta-content"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!--Timeline item-->
                            <div class="timeline-item">
                                <div class="date">
                                    <span>Sep 23, 2020</span>
                                </div>
                                <div class="dot"></div>
                                <div class="content-wrap">
                                    <div class="content-box">
                                        <div class="status"></div>
                                        <div class="h-avatar">
                                            <img class="avatar" src="https://via.placeholder.com/150x150"
                                                data-demo-src="assets/img/avatars/photos/13.jpg" alt=""
                                                data-user-popover="6">
                                            <img class="badge" src="https://via.placeholder.com/150x150"
                                                data-demo-src="assets/img/icons/stacks/illustrator.svg">
                                        </div>
                                        <div class="box-text">
                                            <div class="meta-text">
                                                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                                                <span>11:42 am</span>
                                            </div>
                                            <div class="meta-content"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
